<div class="product-card">

  <img
    [src]="product().image"
    [alt]="product().name"
  >

  <div class="product-info">

    <h3>
      {{ product().name }}
    </h3>

    <p class="category">
      {{ product().category }}
    </p>

    <p class="description">
      {{ product().description }}
    </p>

    <div class="product-bottom">

      <span class="price">
        ₹{{ product().prices }}
      </span>

      <span class="rating">
        ⭐ {{ product().rating }}
      </span>

    </div>

    <a
      [routerLink]="['/product', product().id]"
      class="details-button">

      View Details

    </a>

  </div>

</div>
